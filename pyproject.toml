[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-gate"
version = "0.4.0"
description = "Lightweight shared-key access gate for FastAPI-based demo apps"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tatsutaka Kanazawa" }]
keywords = ["fastapi", "starlette", "middleware", "access-gate", "demo", "authentication"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.161.1",
    "starlette>=1.9.0",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "httpx>=0.28.1",
]

[project.urls]
Homepage = "https://github.com/kanazawazawa/demo-gate"
Repository = "https://github.com/kanazawazawa/demo-gate"
Issues = "https://github.com/kanazawazawa/demo-gate/issues"
Changelog = "https://github.com/kanazawazawa/demo-gate/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
demo_gate = ["static/*", "py.typed"]
