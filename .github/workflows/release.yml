name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine pip-audit
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test]"

      - name: Test and audit
        run: |
          python -m pytest -q
          python -m pip list --format=freeze --exclude-editable > "$RUNNER_TEMP/audit-requirements.txt"
          python -m pip_audit --strict --no-deps --disable-pip -r "$RUNNER_TEMP/audit-requirements.txt"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check dist
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI (Trusted Publisher / OIDC)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/demo-gate
    permissions:
      id-token: write # OIDC トークン発行に必要
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
