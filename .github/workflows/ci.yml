name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
          check-latest: true

      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel build pip-audit
          python -m pip install --upgrade --upgrade-strategy eager -e ".[test]"

      - name: Run tests
        run: python -m pytest -q

      - name: Build distribution
        run: python -m build

      - name: Audit dependencies
        run: python -m pip_audit --strict --skip-editable
